[project]
name = "thunderbird_hausverwaltung"
authors = [
    { name = "janis" }
]
description = "Thunderbird bridge for the Frappe Hausverwaltung app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "thunderbird_hausverwaltung"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
hausverwaltung = ">=0.0.1"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

